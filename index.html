<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend App</title>
</head>
<body>

    <!-- Saved Sheet URL Input -->
    <div>
        <label for="sheet-url-input">Google Sheet Web / CSV URL:</label>
        <input type="text" id="sheet-url-input" placeholder="Paste URL here">
        <button onclick="saveSheetUrl()">Save URL</button>
        <button onclick="clearSheetUrl()">Clear</button>
        <span id="url-save-status"></span>
    </div>

    <br>

    <!-- Original Control Buttons & Navigation -->
    <div>
        <button class="tab-btn" onclick="switchTab(event, 'tab-staged')">Staged Matches</button>
        <button class="tab-btn" onclick="switchTab(event, 'tab-sheets')">Batch Output</button>
    </div>

    <div id="tab-staged" class="tab-content">
        <button onclick="lockAndGenerateBatch()">Lock & Generate Batch</button>
    </div>

    <div id="tab-sheets" class="tab-content">
        <div id="tsv-output-box"></div>
        <button id="send-sheet-btn" onclick="sendToGoogleSheet()">Send to Google Sheet</button>
    </div>

    <script>
        let stagedMatches = [];
        let finalizedTSV = "";

        // Auto-load saved URL on startup
        document.addEventListener('DOMContentLoaded', () => {
            const savedUrl = localStorage.getItem('backend_sheet_url');
            if (savedUrl) {
                document.getElementById('sheet-url-input').value = savedUrl;
            }
        });

        // Save URL function
        function saveSheetUrl() {
            const urlInput = document.getElementById('sheet-url-input').value.trim();
            if (!urlInput) {
                alert("Please enter a valid URL.");
                return;
            }
            localStorage.setItem('backend_sheet_url', urlInput);
            document.getElementById('url-save-status').innerText = "URL saved!";
            setTimeout(() => { document.getElementById('url-save-status').innerText = ""; }, 3000);
        }

        // Clear URL function
        function clearSheetUrl() {
            localStorage.removeItem('backend_sheet_url');
            document.getElementById('sheet-url-input').value = "";
            document.getElementById('url-save-status').innerText = "URL cleared!";
            setTimeout(() => { document.getElementById('url-save-status').innerText = ""; }, 3000);
        }

        // Helper to retrieve saved URL
        function getSavedSheetUrl() {
            return localStorage.getItem('backend_sheet_url') || "";
        }

        // Tab switcher logic
        function switchTab(evt, tabName) {
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(c => c.style.display = 'none');
            document.getElementById(tabName).style.display = 'block';
        }

        // Updated Parser (Handles W, TR, 8BB, and NP)
        function parseMatchDetails(payload) {
            let homeTeam = "Unknown Home";
            let visitTeam = "Unknown Visit";
            let scoreText = "N/A";
            let individualGames = [];

            const htMatch = payload.match(/\[HT\]\s+(.*?)(?:\s*\((\d+)\))?$/m);
            const vtMatch = payload.match(/\[VT\]\s+(.*?)(?:\s*\((\d+)\))?$/m);

            if (htMatch) homeTeam = htMatch[1].trim();
            if (vtMatch) visitTeam = vtMatch[1].trim();

            const hScoreMatch = payload.match(/\[HT\].*?\((\d+)\)/);
            const vScoreMatch = payload.match(/\[VT\].*?\((\d+)\)/);
            if (hScoreMatch && vScoreMatch) {
                scoreText = `${hScoreMatch[1]} - ${vScoreMatch[1]}`;
            }

            const lines = payload.split(/\r?\n/);
            lines.forEach(line => {
                const trimmed = line.trim();
                const gameRowRegex = /^(?:(Gm\d+)\s+)?(.*?)\s+vs\s+(.*)$/i;
                const matchResult = trimmed.match(gameRowRegex);

                if (matchResult) {
                    const gameNum = matchResult[1] || "Gm";
                    const homeRaw = matchResult[2].trim();
                    const visitRaw = matchResult[3].trim();

                    const homeWin = /\(W\)/i.test(homeRaw);
                    const homeTR = /\(TR\)/i.test(homeRaw);
                    const home8BB = /\(8BB\)/i.test(homeRaw);
                    const homeNP = /\(NP\)/i.test(homeRaw);
                    const homePlayer = homeRaw.replace(/\((W|TR|8BB|NP)\)/gi, '').trim();

                    const visitWin = /\(W\)/i.test(visitRaw);
                    const visitTR = /\(TR\)/i.test(visitRaw);
                    const visit8BB = /\(8BB\)/i.test(visitRaw);
                    const visitNP = /\(NP\)/i.test(visitRaw);
                    const visitPlayer = visitRaw.replace(/\((W|TR|8BB|NP)\)/gi, '').trim();

                    individualGames.push({
                        gameNum, homePlayer, homeNP, homeWin, homeTR, home8BB,
                        visitPlayer, visitNP, visitWin, visitTR, visit8BB
                    });
                }
            });

            if (individualGames.length === 0) {
                individualGames.push({
                    gameNum: "Overall", homePlayer: homeTeam, visitPlayer: visitTeam,
                    homeNP: false, homeWin: false, homeTR: false, home8BB: false,
                    visitNP: false, visitWin: false, visitTR: false, visit8BB: false
                });
            }

            return { homeTeam, visitTeam, scoreText, individualGames };
        }

        // Lock & Generate Batch (Excludes repeating header titles)
        function lockAndGenerateBatch() {
            const unapproved = stagedMatches.filter(m => !m.approved);
            if (unapproved.length > 0) {
                if (!confirm(`You have ${unapproved.length} unapproved match(es). Lock and generate batch anyway?`)) return;
            }

            let tsvRows = [];
            
            stagedMatches.forEach(m => {
                const timestamp = new Date().toISOString();
                const headerTitle = "8-BALL CASH LEAGUE";
                const [hScore, vScore] = m.scoreText.includes('-') ? m.scoreText.split('-').map(s => s.trim()) : ["0", "0"];

                m.individualGames.forEach(game => {
                    tsvRows.push([
                        timestamp,
                        headerTitle,
                        m.homeTeam,
                        hScore,
                        m.visitTeam,
                        vScore,
                        game.gameNum || "Gm",
                        game.homePlayer || "",
                        game.homeNP ? "Yes" : "No",
                        game.homeWin ? "Win" : "",
                        game.homeTR ? "TR" : "",
                        game.home8BB ? "8BB" : "",
                        game.visitPlayer || "",
                        game.visitNP ? "Yes" : "No",
                        game.visitWin ? "Win" : "",
                        game.visitTR ? "TR" : "",
                        game.visit8BB ? "8BB" : "",
                        m.homeSig || "",
                        m.visitSig || ""
                    ].join('\t'));
                });
            });

            finalizedTSV = tsvRows.join('\n');
            document.getElementById('tsv-output-box').innerText = finalizedTSV;

            document.getElementById('send-sheet-btn').disabled = false;
            document.getElementById('send-sheet-btn').style.opacity = '1';

            switchTab({ currentTarget: document.querySelectorAll('.tab-btn')[1] }, 'tab-sheets');
        }

        function sendToGoogleSheet() {
            const targetUrl = getSavedSheetUrl();
            if (!targetUrl) {
                alert("Please save a Google Sheet URL first.");
                return;
            }
        }
    </script>
</body>
</html>
