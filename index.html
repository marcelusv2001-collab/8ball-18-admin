<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Match Hub</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.5; }
        .control-panel { margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; background: #f9f9f9; border-radius: 6px; }
        .input-group { display: flex; gap: 8px; margin-top: 5px; }
        input[type="text"] { flex: 1; padding: 8px; font-size: 14px; }
        button { padding: 8px 12px; cursor: pointer; font-size: 14px; }
        .btn-danger { background-color: #d9534f; color: white; border: none; }
        .status-msg { font-size: 12px; margin-top: 4px; display: block; font-weight: bold; }
        .tab-btn { padding: 10px 15px; margin-right: 5px; cursor: pointer; }
        .tab-content { margin-top: 15px; }
        #tsv-output-box { width: 100%; height: 150px; font-family: monospace; }
    </style>
</head>
<body>

    <!-- Saved Sheet URL Settings Section -->
    <div class="control-panel">
        <label for="sheet-url-input" style="font-weight: bold; display: block;">
            Google Sheet Web / CSV URL:
        </label>
        <div class="input-group">
            <input 
                type="text" 
                id="sheet-url-input" 
                placeholder="https://docs.google.com/spreadsheets/d/e/.../pub?output=tsv" 
            />
            <button onclick="saveSheetUrl()">Save URL</button>
            <button onclick="clearSheetUrl()" class="btn-danger">Clear</button>
        </div>
        <span id="url-save-status" class="status-msg" style="color: green;"></span>
    </div>

    <!-- Interface Controls & Tabs -->
    <div>
        <button class="tab-btn" onclick="switchTab(event, 'tab-staged')">Staged Matches</button>
        <button class="tab-btn" onclick="switchTab(event, 'tab-sheets')">Batch Output</button>
    </div>

    <div id="tab-staged" class="tab-content">
        <button onclick="lockAndGenerateBatch()">Lock & Generate Batch</button>
    </div>

    <div id="tab-sheets" class="tab-content" style="display: none;">
        <h3>Finalized TSV Batch</h3>
        <textarea id="tsv-output-box" readonly></textarea>
        <br>
        <button id="send-sheet-btn" onclick="sendToGoogleSheet()" disabled style="opacity: 0.5;">Send to Google Sheet</button>
    </div>

    <script>
        let stagedMatches = [];
        let finalizedTSV = "";

        // Load saved URL from browser memory on startup
        document.addEventListener('DOMContentLoaded', () => {
            const savedUrl = localStorage.getItem('backend_sheet_url');
            if (savedUrl) {
                document.getElementById('sheet-url-input').value = savedUrl;
            }
        });

        // Save URL locally
        function saveSheetUrl() {
            const urlInput = document.getElementById('sheet-url-input').value.trim();
            if (!urlInput) {
                alert("Please enter a valid URL.");
                return;
            }
            
            localStorage.setItem('backend_sheet_url', urlInput);
            
            const statusLabel = document.getElementById('url-save-status');
            statusLabel.style.color = "green";
            statusLabel.innerText = "URL saved locally!";
            setTimeout(() => { statusLabel.innerText = ""; }, 3000);
        }

        // Clear stored URL
        function clearSheetUrl() {
            localStorage.removeItem('backend_sheet_url');
            document.getElementById('sheet-url-input').value = "";
            
            const statusLabel = document.getElementById('url-save-status');
            statusLabel.style.color = "red";
            statusLabel.innerText = "URL cleared!";
            setTimeout(() => { 
                statusLabel.innerText = ""; 
                statusLabel.style.color = "green";
            }, 3000);
        }

        // Get saved URL helper
        function getSavedSheetUrl() {
            return localStorage.getItem('backend_sheet_url') || "";
        }

        // Tab navigation handler
        function switchTab(evt, tabName) {
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(c => c.style.display = 'none');
            document.getElementById(tabName).style.display = 'block';
        }

        // Match Parser Function
        function parseMatchDetails(payload) {
            let homeTeam = "Unknown Home";
            let visitTeam = "Unknown Visit";
            let scoreText = "N/A";
            let individualGames = [];

            const htMatch = payload.match(/\[HT\]\s+(.*?)(?:\s*\((\d+)\))?$/m);
            const vtMatch = payload.match(/\[VT\]\s+(.*?)(?:\s*\((\d+)\))?$/m);

            if (htMatch) homeTeam = htMatch[1].trim();
            if (vtMatch) visitTeam = vtMatch[1].trim();

            const hScoreMatch = payload.match(/\[HT\].*?\((\d+)\)/);
            const vScoreMatch = payload.match(/\[VT\].*?\((\d+)\)/);
            if (hScoreMatch && vScoreMatch) {
                scoreText = `${hScoreMatch[1]} - ${vScoreMatch[1]}`;
            }

            const lines = payload.split(/\r?\n/);
            lines.forEach(line => {
                const trimmed = line.trim();
                const gameRowRegex = /^(?:(Gm\d+)\s+)?(.*?)\s+vs\s+(.*)$/i;
                const matchResult = trimmed.match(gameRowRegex);

                if (matchResult) {
                    const gameNum = matchResult[1] || "Gm";
                    const homeRaw = matchResult[2].trim();
                    const visitRaw = matchResult[3].trim();

                    // Extract flags for Home Player
                    const homeWin = /\(W\)/i.test(homeRaw);
                    const homeTR = /\(TR\)/i.test(homeRaw);
                    const home8BB = /\(8BB\)/i.test(homeRaw);
                    const homeNP = /\(NP\)/i.test(homeRaw);
                    const homePlayer = homeRaw.replace(/\((W|TR|8BB|NP)\)/gi, '').trim();

                    // Extract flags for Visiting Player
                    const visitWin = /\(W\)/i.test(visitRaw);
                    const visitTR = /\(TR\)/i.test(visitRaw);
                    const visit8BB = /\(8BB\)/i.test(visitRaw);
                    const visitNP = /\(NP\)/i.test(visitRaw);
                    const visitPlayer = visitRaw.replace(/\((W|TR|8BB|NP)\)/gi, '').trim();

                    individualGames.push({
                        gameNum,
                        homePlayer,
                        homeNP,
                        homeWin,
                        homeTR,
                        home8BB,
                        visitPlayer,
                        visitNP,
                        visitWin,
                        visitTR,
                        visit8BB
                    });
                }
            });

            if (individualGames.length === 0) {
                individualGames.push({
                    gameNum: "Overall",
                    homePlayer: homeTeam,
                    visitPlayer: visitTeam,
                    homeNP: false, homeWin: false, homeTR: false, home8BB: false,
                    visitNP: false, visitWin: false, visitTR: false, visit8BB: false
                });
            }

            return { homeTeam, visitTeam, scoreText, individualGames };
        }

        // Batch lock and row generator without headers
        function lockAndGenerateBatch() {
            const unapproved = stagedMatches.filter(m => !m.approved);
            if (unapproved.length > 0) {
                if (!confirm(`You have ${unapproved.length} unapproved match(es). Lock and generate batch anyway?`)) return;
            }

            let tsvRows = [];
            
            stagedMatches.forEach(m => {
                const timestamp = new Date().toISOString();
                const headerTitle = "8-BALL CASH LEAGUE";
                const [hScore, vScore] = m.scoreText.includes('-') ? m.scoreText.split('-').map(s => s.trim()) : ["0", "0"];

                m.individualGames.forEach(game => {
                    tsvRows.push([
                        timestamp,
                        headerTitle,
                        m.homeTeam,
                        hScore,
                        m.visitTeam,
                        vScore,
                        game.gameNum || "Gm",
                        game.homePlayer || "",
                        game.homeNP ? "Yes" : "No",
                        game.homeWin ? "Win" : "",
                        game.homeTR ? "TR" : "",
                        game.home8BB ? "8BB" : "",
                        game.visitPlayer || "",
                        game.visitNP ? "Yes" : "No",
                        game.visitWin ? "Win" : "",
                        game.visitTR ? "TR" : "",
                        game.visit8BB ? "8BB" : "",
                        m.homeSig || "",
                        m.visitSig || ""
                    ].join('\t'));
                });
            });

            finalizedTSV = tsvRows.join('\n');
            document.getElementById('tsv-output-box').value = finalizedTSV;

            document.getElementById('send-sheet-btn').disabled = false;
            document.getElementById('send-sheet-btn').style.opacity = '1';

            switchTab(null, 'tab-sheets');
        }

        function sendToGoogleSheet() {
            const targetUrl = getSavedSheetUrl();
            if (!targetUrl) {
                alert("Please save a Google Sheet URL first.");
                return;
            }
            // Add your web app POST/fetch logic here using targetUrl
        }
    </script>
</body>
</html>
